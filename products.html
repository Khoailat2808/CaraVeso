<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sản phẩm — CaraVeso</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Italiana&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="products">

  <div id="site-header"></div>

  <!-- ===== BREADCRUMB ===== -->
  <nav class="breadcrumb" aria-label="Breadcrumb">
    <div class="container">
      <ol>
        <li><a href="index.html">Trang chủ</a></li>
        <li><a href="products.html">Sản phẩm</a></li>
        <li>Tất cả sản phẩm</li>
      </ol>
    </div>
  </nav>

  <main class="container">
    <!-- ===== TIÊU ĐỀ + SẮP XẾP ===== -->
    <div class="page-head">
      <h1 class="page-title">Sản phẩm<small id="result-count"></small></h1>
      <div class="sort-control">
        <span>⇅ Sắp xếp theo:</span>
        <select id="sort-select" aria-label="Sắp xếp sản phẩm">
          <option value="default">Mặc định</option>
          <option value="price-asc">Giá tăng dần</option>
          <option value="price-desc">Giá giảm dần</option>
          <option value="name">Tên A → Z</option>
        </select>
      </div>
    </div>

    <div class="catalog">
      <!-- ===== SIDEBAR BỘ LỌC ===== -->
      <aside class="filters">
        <h2 class="filters__title">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
          Bộ lọc
        </h2>

        <!-- Lọc theo giá -->
        <div class="filter-group">
          <button class="filter-group__head" type="button">
            <span>Giá <small>(VND)</small></span>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M18 15l-6-6-6 6"/></svg>
          </button>
          <div class="filter-group__body">
            <input type="range" class="price-range" id="price-range" min="500000" max="35000000" step="500000" value="35000000" aria-label="Giá tối đa">
            <div class="price-scale"><span>500.000</span><span>35.000.000</span></div>
            <div class="price-inputs">
              <input type="number" id="price-min" placeholder="650.000" min="0" aria-label="Giá từ">
              <span>—</span>
              <input type="number" id="price-max" placeholder="800.000" min="0" aria-label="Giá đến">
            </div>
          </div>
        </div>

        <!-- Lọc theo màu -->
        <div class="filter-group">
          <button class="filter-group__head" type="button">
            <span>Màu sắc</span>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M18 15l-6-6-6 6"/></svg>
          </button>
          <div class="filter-group__body">
            <div class="color-swatches">
              <button class="color-swatch" data-color="#efe9dd" style="background:#efe9dd" aria-label="Trắng kem"></button>
              <button class="color-swatch" data-color="#0b3056" style="background:#0b3056" aria-label="Xanh navy"></button>
              <button class="color-swatch" data-color="#b58e5a" style="background:#b58e5a" aria-label="Gỗ sồi"></button>
              <button class="color-swatch" data-color="#f3c7cf" style="background:#f3c7cf" aria-label="Hồng pastel"></button>
              <button class="color-swatch" data-color="#175e3b" style="background:#175e3b" aria-label="Xanh lục"></button>
              <button class="color-swatch" data-color="#e08b4e" style="background:#e08b4e" aria-label="Cam đất"></button>
              <button class="color-swatch" data-color="#e8e2d5" style="background:#e8e2d5" aria-label="Be sáng"></button>
              <button class="color-swatch" data-color="#8a8a8a" style="background:#8a8a8a" aria-label="Xám"></button>
            </div>
          </div>
        </div>

        <!-- Lọc theo phân loại -->
        <div class="filter-group">
          <button class="filter-group__head" type="button">
            <span>Phân loại</span>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M18 15l-6-6-6 6"/></svg>
          </button>
          <div class="filter-group__body">
            <label class="filter-check"><input type="checkbox" name="category" value="sofa"> Ghế sofa</label>
            <label class="filter-check"><input type="checkbox" name="category" value="ban"> Bàn</label>
            <label class="filter-check"><input type="checkbox" name="category" value="tu"> Tủ</label>
            <label class="filter-check"><input type="checkbox" name="category" value="ke"> Kệ</label>
            <label class="filter-check"><input type="checkbox" name="category" value="nem"> Nệm - Chăn ga</label>
            <label class="filter-check"><input type="checkbox" name="category" value="den"> Đèn trang trí</label>
            <label class="filter-check"><input type="checkbox" name="category" value="trang-tri"> Đồ trang trí</label>
          </div>
        </div>

        <!-- Chất liệu (thu gọn mặc định như Figma) -->
        <div class="filter-group is-collapsed">
          <button class="filter-group__head" type="button">
            <span>Chất liệu</span>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M18 15l-6-6-6 6"/></svg>
          </button>
          <div class="filter-group__body">
            <label class="filter-check"><input type="checkbox"> Gỗ tự nhiên</label>
            <label class="filter-check"><input type="checkbox"> Vải Bouclé</label>
            <label class="filter-check"><input type="checkbox"> Da công nghiệp</label>
            <label class="filter-check"><input type="checkbox"> Đá cẩm thạch</label>
          </div>
        </div>
      </aside>

      <!-- ===== LƯỚI SẢN PHẨM (render bằng JS) ===== -->
      <div>
        <div class="product-grid" id="product-grid"></div>
        <div class="load-more-wrap">
          <button class="btn-load-more" id="btn-load-more">Xem thêm</button>
        </div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
