<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chỉnh sửa thông tin - CaraVeso</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Italiana&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/css/style.css">
</head>
<body data-page="account-edit">
  <div id="site-header"></div>
  <main class="account-shell">
    <aside class="account-sidebar">
      <nav class="account-menu" aria-label="Tài khoản">
        <a class="account-menu__item is-active" href="../tai-khoan/"><svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 100-10 5 5 0 000 10zm0 2c-4.4 0-8 2.7-8 6v1h16v-1c0-3.3-3.6-6-8-6z"/></svg>Tài khoản của tôi</a>
        <a class="account-menu__item" href="../don-hang/"><svg viewBox="0 0 24 24"><path d="M7 3h10v3h3v15H4V6h3V3zm2 3h6V5H9v1zm-1 5h8v2H8v-2zm0 4h8v2H8v-2z"/></svg>Đơn hàng</a>
        <a class="account-menu__item" href="../chi-tiet-dich-vu/"><svg viewBox="0 0 24 24"><path d="M22 19.6l-6.3-6.3a6.7 6.7 0 01-8.4-8.4l4 4 2.8-2.8-4-4a6.7 6.7 0 018.4 8.4l6.3 6.3-2.8 2.8z"/></svg>Dịch vụ hậu mãi</a>
        <a class="account-menu__item" href="../dia-chi/"><svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 00-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 00-7-7zm0 9.5A2.5 2.5 0 1112 6a2.5 2.5 0 010 5.5z"/></svg>Danh sách địa chỉ</a>
        <a class="account-menu__item" href="../yeu-thich/"><svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 00-7.8 0L12 5.7l-1-1a5.5 5.5 0 10-7.8 7.8L12 21.3l8.8-8.8a5.5 5.5 0 000-7.9z"/></svg>Danh sách yêu thích</a>
        <hr class="account-menu__divider">
        <a class="account-menu__item" href="../danh-gia/"><svg viewBox="0 0 24 24"><path d="M12 2l2.9 6 6.6.9-4.8 4.7 1.1 6.6L12 17.1l-5.8 3.1 1.1-6.6-4.8-4.7 6.6-.9L12 2z"/></svg>Đánh giá</a>
        <a class="account-menu__item" href="../dang-nhap/"><svg viewBox="0 0 24 24"><path d="M10 17v-3H3v-4h7V7l5 5-5 5zm3-13h8v16h-8v-2h6V6h-6V4z"/></svg>Đăng xuất</a>
      </nav>
    </aside>
    <section class="account-content">
      <h1 class="account-title">Thông tin tài khoản</h1>
      <h2 class="account-subtitle">Chỉnh sửa thông tin</h2>
      <form class="account-form" id="account-edit-form" novalidate>
        <div class="form-group"><label for="ae-email">Email <span class="req">*</span></label><input class="form-control" id="ae-email" type="email" value="tienhhk24411@st.uel.edu.vn" disabled><span class="form-error"></span></div>
        <div class="form-group"><label for="ae-name">Họ và Tên <span class="req">*</span></label><input class="form-control" id="ae-name" value="Hoang Hủy Tien"><span class="form-error"></span></div>
        <div class="form-group"><label for="ae-phone">Số điện thoại <span class="req">*</span></label><input class="form-control" id="ae-phone" value="0919120176"><span class="form-error"></span></div>
        <div class="form-group"><label for="ae-gender">Giới tính</label><select class="form-control" id="ae-gender"><option>Chọn giới tính</option><option selected>Nam</option><option>Nu</option><option>Khac</option></select><span class="form-error"></span></div>
        <div class="form-group"><label for="ae-birthday">Ngày sinh</label><input class="form-control" id="ae-birthday" value="08/09/2006" placeholder="Thêm ngày sinh"><span class="form-error"></span></div>
        <div class="account-form-actions"><button class="btn-primary" type="submit">Lưu thông tin</button><a class="btn-outline" href="../tai-khoan/">Hủy</a></div>
      </form>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="../shared/js/data.js"></script>
  <script src="../shared/js/main.js"></script>
</body>
</html>
